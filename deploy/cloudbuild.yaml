# Cloud Build configuration for enterprise-roi-engine
# Builds and deploys to Cloud Run as a unified service
#
# STRATEGIC HARDENING PASS - PERFORMANCE BUDGETS:
# - MAX_TOKENS: 2500
# - MAX_LATENCY_MS: 5000 (5 seconds)
#
# ROLE RULES:
# - Agent MAY: Model ROI, Compare scenarios, Estimate risk-adjusted value
# - Agent MUST NOT: Recommend final decisions, Trigger deployments
#
# DECISIONEVENT RULES:
# - Emits: roi_estimate_signal, value_tradeoff_signal, economic_risk_signal

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:latest'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'enterprise-roi-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '30s'
      - '--set-env-vars'
      - 'NODE_ENV=production,PLATFORM_ENV=${_PLATFORM_ENV},SERVICE_NAME=enterprise-roi-engine,SERVICE_VERSION=$COMMIT_SHA'
      - '--set-secrets'
      - 'RUVECTOR_SERVICE_URL=ruvector-service-url:latest,RUVECTOR_API_KEY=ruvector-api-key:latest'

# Substitutions (can be overridden)
substitutions:
  _PLATFORM_ENV: 'dev'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

# Images to store
images:
  - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/enterprise-roi-engine:latest'

# Build timeout
timeout: '1200s'
